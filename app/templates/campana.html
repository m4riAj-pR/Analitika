<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ nombre }} | Oferta Especial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #0f172a;
      letter-spacing: -0.025em;
    }

    .description {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 32px;
    }

    .conversion-box {
      background: #f1f5f9;
      border-radius: 20px;
      padding: 32px;
      border: 1px solid var(--border);
    }

    h3 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .offer-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .btn-submit {
      width: 100%;
      padding: 18px;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
      color: #059669;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .btn-whatsapp:hover {
      color: #047857;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 10px 0;
      animation: scaleUp 0.4s ease-out;
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .success-title {
      font-size: 1.5rem;
      color: #10b981;
      margin-bottom: 8px;
    }

    .instant-label {
      font-size: 0.85rem;
      text-align: center;
      margin-top: 16px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .instant-label::before, .instant-label::after {
      content: "";
      height: 1px;
      width: 20px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-card">
      <h1>{{ nombre }}</h1>
      <p class="description">{{ descripcion }}</p>

      <div class="conversion-box" id="conversion-form">
        <div id="form-content">
          <h3>¿Quieres esta oferta?</h3>
          <p class="offer-text">Haz clic abajo para asegurar tu precio especial antes de que termine el tiempo.</p>
          
          <button onclick="sendConversion()" class="btn-submit">
            <span>¡Asegurar mi oferta!</span>
          </button>
          
          <div class="instant-label">
            Registro instantáneo
          </div>
        </div>

        <div id="success-msg" class="success-msg">
          <span class="success-icon">✅</span>
          <h3 class="success-title">¡Oferta Asegurada!</h3>
          <p>Hemos registrado tu interés correctamente. Un asesor te contactará pronto.</p>
        </div>
      </div>

      <a href="https://wa.me/" class="btn-whatsapp">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.18-2.587-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793 0-.853.448-1.273.607-1.446.159-.173.346-.217.462-.217s.231.006.332.013c.105.007.25.013.391.357.144.354.491 1.2.534 1.288.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86.174.088.275.073.376-.043.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/>
        </svg>
        Soporte por WhatsApp
      </a>
    </div>
  </div>

  <script>
    async function sendConversion() {
      const currentClickId = Number("{{ id_click or 0 }}") || null;
      const btn = document.querySelector('.btn-submit');
      const originalContent = btn.innerHTML;
      
      btn.disabled = true;
      btn.innerHTML = '<span>Procesando...</span>';

      try {
        const response = await fetch('/conversion/public', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_click: currentClickId,
            type: 'interest',
            notes: 'Registro instantáneo (Light Theme)',
            revenue: 0.0
          })
        });

        if (response.ok) {
          document.getElementById('form-content').style.display = 'none';
          document.getElementById('success-msg').style.display = 'block';
        } else {
          alert("No pudimos procesar tu solicitud.");
          btn.disabled = false;
          btn.innerHTML = originalContent;
        }
      } catch (error) {
        console.error("Error:", error);
        btn.disabled = false;
        btn.innerHTML = originalContent;
      }
    }
  </script>
</body>
</html>
